name: Publish Extension

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-patch-on-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      # main requires a reviewed PR for every change, so the workflow can't
      # commit/push a version bump back to the repo (that's the point of
      # the branch protection). Instead of touching git at all, ask the
      # Marketplace what's actually live and publish current+1 explicitly.
      # package.json on main is informational only and may lag — harmless.
      - name: Determine next version
        id: next_version
        run: |
          CURRENT=$(curl -sf -X POST "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json;api-version=3.0-preview.1" \
            -d '{"filters":[{"criteria":[{"filterType":7,"value":"formatex-io.formatex"}]}],"flags":914}' \
            | jq -r '.results[0].extensions[0].versions[0].version')
          if [ -z "$CURRENT" ] || [ "$CURRENT" = "null" ]; then
            echo "::error::Could not determine current Marketplace version"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "Current Marketplace version: $CURRENT -> publishing $NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish "${{ steps.next_version.outputs.next }}" --no-git-tag-version -p "$VSCE_PAT"

  publish-on-release-or-manual:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Determine next version
        id: next_version
        run: |
          CURRENT=$(curl -sf -X POST "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json;api-version=3.0-preview.1" \
            -d '{"filters":[{"criteria":[{"filterType":7,"value":"formatex-io.formatex"}]}],"flags":914}' \
            | jq -r '.results[0].extensions[0].versions[0].version')
          if [ -z "$CURRENT" ] || [ "$CURRENT" = "null" ]; then
            echo "::error::Could not determine current Marketplace version"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "Current Marketplace version: $CURRENT -> publishing $NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish "${{ steps.next_version.outputs.next }}" --no-git-tag-version -p "$VSCE_PAT"
